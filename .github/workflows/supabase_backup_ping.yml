name: Supabase Auto-Ping y Backup Automatizado

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 5 días
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Permite la ejecución manual desde la pestaña Actions de GitHub

jobs:
  supabase-maintenance:
    name: Supabase Ping & Dump
    runs-on: ubuntu-latest

    steps:
      - name: Configurar variables de entorno y fecha
        run: |
          echo "BACKUP_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Instalar cliente de PostgreSQL 17 (pg_dump y psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release

          # Importar la clave GPG del repositorio oficial de PostgreSQL
          sudo mkdir -p /etc/apt/keyrings
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg

          # Agregar el repositorio de PostgreSQL especificando 'noble'
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

          # Actualizar repositorios e instalar postgresql-client-17
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: 1. Auto-Ping (Prevenir pausa por inactividad)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          # Sanitizar DB_URL removiendo retornos de carro (\r) y saltos de línea (\n)
          CLEAN_DB_URL=$(echo "${DB_URL}" | tr -d '\r\n' | xargs)
          if [ -z "$CLEAN_DB_URL" ]; then
            echo "❌ Error: La variable de entorno SUPABASE_DB_URL no está configurada en los Secrets de GitHub."
            exit 1
          fi
          echo "🔌 Conectando a Supabase para auto-ping con PostgreSQL 17..."
          if ! /usr/lib/postgresql/17/bin/psql "$CLEAN_DB_URL" -c "SELECT 1 AS keep_alive;"; then
            echo "❌ Error: No se pudo conectar a la base de datos. Verifica el secret SUPABASE_DB_URL en Settings → Secrets."
            exit 1
          fi
          echo "✅ Ping ejecutado correctamente."

      - name: 2. Copia de seguridad (pg_dump 17)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          set -o pipefail
          # Sanitizar DB_URL removiendo retornos de carro (\r) y saltos de línea (\n)
          CLEAN_DB_URL=$(echo "${DB_URL}" | tr -d '\r\n' | xargs)
          FILENAME="backup-supabase-${{ env.BACKUP_DATE }}.sql.gz"
          echo "📦 Generando backup de la base de datos con pg_dump v17..."
          
          /usr/lib/postgresql/17/bin/pg_dump "$CLEAN_DB_URL" --clean --if-exists | gzip > "$FILENAME"
          
          # Validar que el archivo de backup se haya generado y no esté vacío/corrupto (< 100 bytes)
          SIZE=$(stat -c%s "$FILENAME" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 100 ]; then
            echo "❌ Error: pg_dump generó un archivo corrupto o vacío ($SIZE bytes)."
            rm -f "$FILENAME"
            exit 1
          fi

          echo "✅ Backup generado con éxito: $FILENAME ($SIZE bytes)"
          ls -lh "$FILENAME"

      - name: 3. Guardar Backup como Artifact en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.BACKUP_DATE }}
          path: backup-supabase-${{ env.BACKUP_DATE }}.sql.gz
          retention-days: 90 # Retención máxima gratuita en GitHub Actions
