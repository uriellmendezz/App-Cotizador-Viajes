<div class="max-w-[95%] mx-auto space-y-6">
    <!-- Encabezado -->
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 pt-2">
        <div>
            <h2 class="font-display font-extrabold text-lg text-slate-800 tracking-tight">Comparar Cotizaciones</h2>
            <p class="text-xs text-slate-500 leading-relaxed mt-1">
                Elegí dos o más cotizaciones guardadas para ver sus montos lado a lado. El monto más barato de cada concepto se resalta en verde.
            </p>
        </div>
        <button type="button" id="comparar-clear-btn" onclick="clearComparison()"
            class="hidden self-start sm:self-auto px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-[10px] uppercase tracking-wider rounded-xl transition-all cursor-pointer">
            Limpiar comparación
        </button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-[340px_minmax(0,1fr)] gap-6 items-start">
        <!-- Selector de cotizaciones -->
        <div class="bg-white border border-slate-200/80 rounded-3xl shadow-sm overflow-hidden">
            <div class="flex p-1 m-4 mb-3 bg-slate-100 rounded-xl border border-slate-200/80 gap-1">
                <button type="button" id="comparar-tab-completa" onclick="setComparePickerKind('completa')"
                    class="flex-1 px-3 py-1.5 rounded-lg text-[11px] font-black transition-all cursor-pointer">Cotizaciones</button>
                <button type="button" id="comparar-tab-rapida" onclick="setComparePickerKind('rapida')"
                    class="flex-1 px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all cursor-pointer">Presupuestos</button>
            </div>
            <div class="px-4 pb-3">
                <input type="text" id="comparar-search" placeholder="Buscar por pasajero o destino..."
                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/10 transition-all bg-white">
            </div>
            <div id="comparar-list" class="max-h-[60vh] overflow-y-auto border-t border-slate-100 divide-y divide-slate-100">
                <div class="p-6 text-center text-xs font-semibold text-slate-400">Cargando cotizaciones...</div>
            </div>
        </div>

        <!-- Resultado -->
        <div class="bg-white border border-slate-200/80 rounded-3xl p-6 shadow-sm min-w-0">
            <div class="flex items-center justify-between gap-3 mb-4">
                <h3 class="text-sm font-extrabold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l-2 2m2-2l2 2m4-2v13l2-2m-2 2l-2-2" />
                    </svg>
                    Comparación
                </h3>
                <span id="comparar-count" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider"></span>
            </div>
            <div id="comparar-result">
                <div class="py-14 text-center space-y-2">
                    <p class="text-sm font-bold text-slate-500">Todavía no elegiste cotizaciones</p>
                    <p class="text-xs font-semibold text-slate-400">Sumá al menos dos desde el listado para compararlas.</p>
                </div>
            </div>
        </div>
    </div>
</div>
