<div class="w-full px-8 space-y-6">
    <!-- Back button -->
    <div class="pt-2">
        <button onclick="window.history.back();" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-slate-700 transition-colors cursor-pointer select-none">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
        </button>
    </div>

    <!-- Active Editing Indicator -->
    <div id="editing-indicator"
        class="hidden p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl flex items-center justify-between text-xs font-semibold shadow-sm mb-6">
        <div class="flex items-center gap-2">
            <span id="editing-indicator-text">Editando cotización guardada</span>
        </div>
        <div id="editing-indicator-actions" class="flex gap-2">
            <!-- Botones dinámicos -->
        </div>
    </div>

    <!-- Header Section -->
    <div class="space-y-4">
        <div class="flex items-center gap-3">
            <span class="p-3 bg-brand-primary/10 rounded-2xl text-brand-primary">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </span>
            <div class="flex-1">
                <input type="text" id="rapido-pasajero"
                    class="w-full text-2xl font-medium text-slate-800 border-none bg-transparent focus:ring-0 focus:outline-none placeholder-slate-300 p-0 font-display tracking-tight transition-all shadow-none"
                    placeholder="Título de la Cotización Rápida" alt="Título Presupuesto" value=""
                    style="border: none !important; background: transparent !important; background-color: transparent !important; outline: none !important; box-shadow: none !important; padding: 0 !important;"
                    autocomplete="off">
            </div>
        </div>

        <!-- Clean Open Toolbar Card (Title Top, Value Below Left Aligned) -->
        <div class="w-full bg-white border border-slate-200/90 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between gap-6 md:gap-10 overflow-x-auto no-scrollbar whitespace-nowrap">
                
                <!-- PASAJEROS -->
                <div class="flex flex-col items-start gap-1.5 flex-shrink-0">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 select-none flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Pasajeros
                    </span>
                    <div class="inline-flex items-center gap-2.5">
                        <button type="button" id="btn-pax-dec" onclick="decrementQuickPax()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-extrabold text-base border border-slate-200/90 flex items-center justify-center transition-all disabled:opacity-30 disabled:cursor-not-allowed select-none shadow-2xs cursor-pointer" title="Disminuir pasajeros">-</button>
                        <span id="quick-pax-display" class="font-black text-lg text-slate-800 select-none min-w-[24px] text-center">2</span>
                        <button type="button" id="btn-pax-inc" onclick="incrementQuickPax()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-extrabold text-base border border-slate-200/90 flex items-center justify-center transition-all disabled:opacity-30 disabled:cursor-not-allowed select-none shadow-2xs cursor-pointer" title="Aumentar pasajeros">+</button>
                    </div>
                    <input type="number" id="rapido-pax-count" min="1" max="50" value="2" class="hidden">
                </div>

                <!-- DESTINO -->
                <div class="flex flex-col items-start gap-1.5 flex-shrink-0">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 select-none flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Destino
                    </span>
                    <input type="text" id="rapido-destino" placeholder="Opcional" autocomplete="off" class="w-36 md:w-52 bg-transparent border-b border-slate-200 focus:border-brand-primary text-sm font-bold text-slate-800 placeholder-slate-300 focus:outline-none py-0.5 px-1 transition-colors">
                </div>

                <!-- FECHAS (Salida / Regreso abiertas y conectadas) -->
                <div class="flex flex-col items-start gap-1.5 flex-shrink-0">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 select-none flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        Fechas
                    </span>
                    <div class="inline-flex items-center gap-2.5 py-1">
                        <input type="text" id="rapido-fecha-salida" placeholder="Salida" readonly class="w-28 bg-transparent border-b border-slate-200 focus:border-brand-primary text-sm font-bold text-slate-800 placeholder-slate-400 cursor-pointer focus:outline-none py-0.5 px-1 text-center transition-colors">
                        <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                        </svg>
                        <input type="text" id="rapido-fecha-regreso" placeholder="Regreso" readonly class="w-28 bg-transparent border-b border-slate-200 focus:border-brand-primary text-sm font-bold text-slate-800 placeholder-slate-400 cursor-pointer focus:outline-none py-0.5 px-1 text-center transition-colors">
                    </div>
                </div>

                <!-- MONEDA -->
                <div class="flex flex-col items-start gap-1.5 flex-shrink-0">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 select-none flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Moneda
                    </span>
                    <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200/80 gap-1 shadow-2xs">
                        <button type="button" id="btn-currency-usd" onclick="setQuickCurrency('USD')" class="px-3.5 py-1 rounded-lg text-xs font-black transition-all bg-white text-brand-primary shadow-2xs select-none cursor-pointer">USD</button>
                        <button type="button" id="btn-currency-ars" onclick="setQuickCurrency('ARS')" class="px-3.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-500 hover:text-slate-800 select-none cursor-pointer">ARS</button>
                    </div>
                    <select id="rapido-moneda" class="hidden" onchange="calculateQuickQuote(); saveQuickQuoteFormState();">
                        <option value="USD">USD</option>
                        <option value="ARS">ARS</option>
                    </select>
                </div>

                <!-- REDONDEAR -->
                <div class="flex flex-col items-start gap-1.5 flex-shrink-0">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 select-none">Redondear</span>
                    <div class="py-1 cursor-pointer select-none" onclick="toggleQuickQuoteRedondeo()">
                        <button type="button" id="rapido-redondeo-toggle" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-slate-200" role="switch" aria-checked="false" title="Activar/Desactivar redondeo de totales">
                            <span id="rapido-redondeo-knob" class="pointer-events-none inline-flex h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-0 items-center justify-center text-slate-500 text-xs font-black leading-none select-none">
                                $
                            </span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Table & Actions Group -->
    <div class="w-full space-y-6 mt-10">
        <!-- Single Clean Table -->
        <div class="bg-white border border-slate-200/80 rounded-3xl p-6 shadow-sm overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-extrabold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2" />
                    </svg>
                    Desglose
                </h3>
                <div class="flex items-center gap-3">
                    <!-- Limpiar y restablecer a default -->
                    <button type="button" id="btn-reset-quick-budget"
                        class="hidden items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition-all cursor-pointer flex-shrink-0"
                        title="Restablecer tabla a valores por defecto">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        Limpiar
                    </button>

                    <!-- Hover Dropdown Menu -->
                    <div id="quick-add-concept-container" class="relative group inline-block">
                        <button type="button"
                            class="px-4 py-2 bg-brand-primary/10 hover:bg-brand-primary hover:text-white text-brand-primary rounded-xl text-xs font-extrabold uppercase tracking-wider transition-all cursor-pointer flex items-center gap-1.5 shadow-sm">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            Agregar Concepto
                        </button>
                        <div class="absolute right-0 top-full pt-2 w-44 z-20 hidden group-hover:block hover:block">
                            <div class="bg-white border border-slate-200 rounded-xl shadow-lg py-1">
                                <button type="button" id="btn-add-flight"
                                    class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-brand-primary transition-all flex items-center gap-2">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path
                                            d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L14 19v-5.5l8 2.5z" />
                                    </svg>
                                    Vuelo
                                </button>
                                <button type="button" id="btn-add-hotel"
                                    class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-brand-primary transition-all flex items-center gap-2">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                        stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                    </svg>
                                    Alojamiento
                                </button>
                                <button type="button" id="btn-add-transfer"
                                    class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-brand-primary transition-all flex items-center gap-2">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                        stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                                    </svg>
                                    Traslado
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto max-h-[500px] overflow-y-auto relative">
                <table class="w-full text-left border-collapse text-sm select-none relative">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 bg-white sticky top-0 z-10">
                            <th class="py-3 font-bold uppercase tracking-wider text-[10px] bg-white">Concepto</th>
                            <th id="hdr-total"
                                class="py-3 font-bold uppercase tracking-wider text-[10px] w-[160px] text-right bg-white">
                                Total (USD)</th>
                            <th id="hdr-pax"
                                class="py-3 font-bold uppercase tracking-wider text-[10px] w-[140px] text-right bg-white">
                                Por Persona (USD)</th>
                            <th
                                class="py-3 font-bold uppercase tracking-wider text-[10px] w-[50px] text-center bg-white">
                            </th>
                        </tr>
                    </thead>
                    <tbody id="quick-budget-body" class="divide-y divide-slate-100">
                        <!-- Dynamic rows generated here -->
                    </tbody>
                    <tfoot
                        class="sticky bottom-0 z-10 border-t-2 border-slate-200 bg-slate-50 shadow-[0_-4px_10px_rgba(0,0,0,0.04)]">
                        <!-- Costo Total Row -->
                        <tr class="bg-slate-50 font-bold">
                            <td class="py-4 font-black text-slate-800 text-sm pl-3 bg-slate-50">TOTAL</td>
                            <td id="rapido-total-final"
                                class="py-4 text-right font-black text-slate-800 text-sm pr-2.5 bg-slate-50">USD 0,00
                            </td>
                            <td id="rapido-total-pax"
                                class="py-4 text-right font-black text-brand-primary text-sm pr-3 bg-slate-50">USD 0,00
                            </td>
                            <td class="bg-slate-50"></td>
                        </tr>
                        <!-- Costo Redondeado Row -->
                        <tr id="rapido-redondeo-row"
                            class="bg-emerald-50/70 font-bold border-t border-emerald-100 transition-all duration-300 ease-in-out hidden opacity-0 -translate-y-2">
                            <td class="py-3 font-black text-emerald-800 text-xs pl-3 bg-emerald-50/70">
                                <div class="flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <span>TOTAL REDONDEADO</span>
                                </div>
                            </td>
                            <td id="rapido-total-redondeado"
                                class="py-3 text-right font-black text-emerald-800 text-sm pr-2.5 bg-emerald-50/70">USD 0,00
                            </td>
                            <td id="rapido-pax-redondeado"
                                class="py-3 text-right font-black text-emerald-600 text-sm pr-3 bg-emerald-50/70">USD 0,00
                            </td>
                            <td class="bg-emerald-50/70"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-end mt-8">
            <button type="button" id="btn-save-quick-only"
                class="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs uppercase tracking-wider rounded-xl transition-all active:scale-95 cursor-pointer">
                Guardar
            </button>
            <button type="button" id="btn-save-quick-and-go"
                class="px-6 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-slate-900/20 transition-all active:scale-95 cursor-pointer flex items-center justify-center gap-1.5">
                Continuar a Cotización Completa
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>
</div>
