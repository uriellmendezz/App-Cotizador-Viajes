<div class="max-w-[98%] mx-auto space-y-6 py-6">
    <!-- Back button -->
    <div>
        <button onclick="window.history.back();" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-slate-700 transition-colors cursor-pointer select-none">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
        </button>
    </div>

    <!-- 1. Encabezado de la Página (Top-level Header - Pasajero + Metadatos arriba con Kickers Simétricos, Botones de Acción debajo) -->
    <div class="w-full flex flex-col gap-6 pb-6 border-b border-slate-200/60">
        <!-- Bloque de Información Principal (Alineado arriba y a la izquierda con Kickers Supertexto) -->
        <div class="flex flex-wrap items-start justify-start gap-x-8 lg:gap-x-12 gap-y-4 min-w-0 flex-1">
            <!-- Bloque 1: Pasajero -->
            <div class="space-y-1 min-w-0">
                <h5 class="text-[10px] sm:text-[11px] font-extrabold uppercase tracking-widest text-slate-400 select-none">
                    PASAJERO
                </h5>
                <h1 id="ver-pax-name" class="text-2xl sm:text-3xl lg:text-4xl font-[850] text-slate-900 tracking-tight leading-tight break-words min-w-0">
                    -
                </h1>
            </div>

            <!-- Separador Vertical 1 -->
            <div class="hidden sm:block h-10 w-[1px] bg-slate-200/80 self-center shrink-0" aria-hidden="true"></div>

            <!-- Bloque 2: Creado Por -->
            <div class="space-y-1 min-w-0 shrink-0">
                <h5 class="text-[10px] sm:text-[11px] font-extrabold uppercase tracking-widest text-slate-400 select-none">
                    CREADO POR
                </h5>
                <div id="ver-agente-badge-container" class="pt-0.5 inline-flex items-center min-w-0">
                    <span id="ver-agente-tag" class="text-sm sm:text-base lg:text-lg font-bold text-slate-500">-</span>
                </div>
            </div>

            <!-- Separador Vertical 2 -->
            <div class="hidden sm:block h-10 w-[1px] bg-slate-200/80 self-center shrink-0" aria-hidden="true"></div>

            <!-- Bloque 3: Fecha y Hora de Creado -->
            <div class="space-y-1 min-w-0 shrink-0">
                <h5 class="text-[10px] sm:text-[11px] font-extrabold uppercase tracking-widest text-slate-400 select-none">
                    FECHA Y HORA DE CREADO
                </h5>
                <div class="inline-flex items-center gap-2 text-slate-700 text-sm sm:text-base lg:text-lg font-semibold pt-0.5">
                    <span id="ver-created-at">-</span>
                </div>
            </div>
        </div>

        <!-- Fila de Botones de Acción (Base Glassmorphism + Hover con colores distintivos) -->
        <div class="grid grid-cols-4 gap-2.5 sm:gap-4 w-full shrink-0 pt-1">
            <!-- Editar (Hover: Rosa de la app) -->
            <div class="relative group">
                <button type="button" id="btn-edit-quote-view" onclick="window.editQuoteFromView()"
                    title="Editar Cotización"
                    class="w-full inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-3 bg-white/40 hover:bg-brand-primary text-slate-700 hover:text-white border border-slate-200/80 hover:border-brand-primary backdrop-blur-md text-xs sm:text-sm font-extrabold rounded-2xl shadow-xs hover:shadow-md hover:shadow-brand-primary/20 transition-all duration-300 ease-in-out hover:scale-[1.02] active:scale-[0.98] cursor-pointer whitespace-nowrap min-w-0">
                    <svg class="w-4 h-4 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                    <span class="truncate">Editar</span>
                </button>
            </div>

            <!-- Descargar (Hover: Negro de la app) -->
            <div class="relative group">
                <button type="button" onclick="window.downloadPDFBlob()"
                    title="Descargar PDF"
                    class="w-full inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-3 bg-white/40 hover:bg-slate-900 text-slate-700 hover:text-white border border-slate-200/80 hover:border-slate-900 backdrop-blur-md text-xs sm:text-sm font-extrabold rounded-2xl shadow-xs hover:shadow-md transition-all duration-300 ease-in-out hover:scale-[1.02] active:scale-[0.98] cursor-pointer whitespace-nowrap min-w-0">
                    <svg class="w-4 h-4 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="truncate">Descargar</span>
                </button>
            </div>

            <!-- Duplicar (Hover: Negro de la app) -->
            <div class="relative group">
                <button type="button" id="btn-duplicate-quote-view" onclick="window.duplicateQuoteFromView()"
                    title="Duplicar Cotización"
                    class="w-full inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-3 bg-white/40 hover:bg-slate-900 text-slate-700 hover:text-white border border-slate-200/80 hover:border-slate-900 backdrop-blur-md text-xs sm:text-sm font-extrabold rounded-2xl shadow-xs hover:shadow-md transition-all duration-300 ease-in-out hover:scale-[1.02] active:scale-[0.98] cursor-pointer whitespace-nowrap min-w-0">
                    <svg class="w-4 h-4 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span class="truncate">Duplicar</span>
                </button>
            </div>

            <!-- Eliminar (Hover: Rojo destructivo de la app) -->
            <div class="relative group">
                <button type="button" id="btn-delete-quote-view" onclick="window.deleteQuoteFromView()"
                    title="Eliminar Cotización"
                    class="w-full inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-3 bg-rose-50/70 hover:bg-rose-600 text-rose-600 hover:text-white border border-rose-200/70 hover:border-rose-600 backdrop-blur-md text-xs sm:text-sm font-extrabold rounded-2xl shadow-xs hover:shadow-md hover:shadow-rose-600/20 transition-all duration-300 ease-in-out hover:scale-[1.02] active:scale-[0.98] cursor-pointer whitespace-nowrap min-w-0">
                    <svg class="w-4 h-4 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span class="truncate">Eliminar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Cuerpo Principal (Columnas Intercambiadas) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 pt-2">
        <!-- Columna Izquierda: Visor de PDF (7 cols en lg) -->
        <div class="lg:col-span-7 flex flex-col bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-lg w-full"
            style="height: 125vh; min-height: 1150px;">
            <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                <span class="text-xs font-extrabold uppercase text-slate-500 tracking-wider flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-brand-primary animate-pulse"></span>
                    Previsualización del PDF
                </span>
                <button type="button" onclick="window.openPDFInNewTab()"
                    class="flex items-center gap-1.5 px-3 py-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-[10px] font-extrabold uppercase tracking-wider shadow-sm transition-all hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    Abrir en nueva pestaña
                </button>
            </div>
            <div class="flex-1 w-full bg-slate-100 relative">
                <iframe id="ver-pdf-iframe" class="absolute inset-0 w-full h-full border-0" src=""
                    allowfullscreen="true"></iframe>
            </div>
        </div>

        <!-- Columna Derecha: Tabla Resumen de la Cotización (5 cols en lg) -->
        <div class="lg:col-span-5 flex flex-col gap-6 w-full self-start">
            <div id="ver-realtime-card" class="bg-white border border-slate-200/80 rounded-3xl p-6 lg:p-7 shadow-md flex flex-col justify-between">
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3.5">
                        <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <svg class="w-4 h-4 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                            Resumen de Cotización
                        </h3>
                    </div>
                    <div id="ver-realtime-breakdown-container" class="space-y-6">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
